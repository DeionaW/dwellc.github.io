  <main>
    <h2>Contact Us</h2>
    
<form action="https://deionaw.github.io/dwellc.github.io/contact.html" method="post">
      <label for="name">Name</label>
<input type="text" id="name" name="name" required>

      <label for="email">Email</label>
<input type="email" id="email" name="email" required>

      <label for="phone">Phone</label>
<input type="tel" id="phone" name="phone">

      <p>Which lesson are you booking?</p>
<label for="lesson-beginner">Beginner Consult</label>
<input type="radio" id="lesson-beginner" name="lesson-type" value="beginner" checked>

<label for="lesson-intermediate">Intermediate Consult</label>
<input type="radio" id="lesson-intermediate" name="lesson-type" value="intermediate">

  <label for="lesson-expert">Expert Consult</label>
<input type="radio" id="lesson-expert" name="lesson-type" value="expert">

   <button onclick="getLocation()">Allow us to find locaitons near you!</button>
<p id="location-message"></p>

      <label for="newsletter">Email me about open consults.</label>
<input type="checkbox" id="newsletter" name="newsletter">

      <label for="message">What would you like a better understanding of to master your finances?</label>
<textarea id="message" name="message" required></textarea>

      <button type="submit">Submit</button>

</form>

    

    <script>
  function getLocation() {
    navigator.geolocation.getCurrentPosition(showPosition, showError);
  }

  function showPosition(position) {
    var lat = position.coords.latitude.toFixed(1);
    var lon = position.coords.longitude.toFixed(1);
    document.getElementById("location-message").textContent =
      "We've located you near " + lat + ", " + lon + ". We'll provide you with sessions available to you. ";
  }

  function showError(error) {
    document.getElementById("location-message").textContent =
      "We are not able to gather your location. We will gather this information during a follow up call.";
  }
</script>
